# Release：推送 v* 标签时触发，从标签（即最新提交所打的标签）提取版本号，
# 写入 dsh-desktop/package.json 后完整构建，并把产物发布到 GitHub Release。
# 缓存策略与 ci.yml 相同：npm 缓存 + Electron 二进制 + electron-builder 工具链。
# 镜像：GitHub 托管 runner 直连 npm/GitHub，无需 README 中的 npmmirror 镜像。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布（Windows x64）
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码（标签指向的提交）
        uses: actions/checkout@v4

      - name: 从标签提取版本号
        id: tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::标签 '${tag}' 不是有效的版本号（期望形如 v4.4.1 或 v4.4.1-rc.1）"
            exit 1
          fi
          echo "tag=${tag}"     >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "标签: ${tag} -> 版本号: ${version}"

      - name: 安装 Node.js（含 npm 缓存）
        uses: actions/setup-node@v4
        with:
          # 26：vnext 分支测试已迁 .test.ts（type-stripping 需 Node ≥ 26），
          # main 的 .mjs 测试在 26 下同样通过
          node-version: 26
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: dsh-electron-win-x64-${{ hashFiles('dsh-desktop/package-lock.json') }}
          restore-keys: |
            dsh-electron-win-x64-

      - name: 缓存 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: dsh-electron-builder-win-x64-${{ hashFiles('dsh-desktop/package-lock.json') }}
          restore-keys: |
            dsh-electron-builder-win-x64-

      - name: 缓存 Rust 构建产物（cargo registry + 各原生模块 target）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dsh-desktop/native/supervisor/target
            dsh-desktop/native/snapshot/target
          key: dsh-cargo-win-x64-${{ hashFiles('dsh-desktop/native/*/Cargo.lock') }}
          restore-keys: |
            dsh-cargo-win-x64-

      - name: 安装依赖
        run: npm ci

      - name: 构建 Rust 原生模块（supervisor + snapshot → index.node）
        # vnext 分支 predist 会校验原生产物；main 尚无 native/ 目录，按
        # Cargo.toml 存在性跳过（hashFiles 对缺失模式返回空串）
        if: hashFiles('dsh-desktop/native/*/Cargo.toml') != ''
        run: |
          node scripts/build-native.js build
          node scripts/build-native.js build snapshot

      - name: 获取内置运行时（node.exe + npm CLI）
        run: npm run fetch-runtime

      - name: 将标签版本号写入 package.json
        run: npm version ${{ steps.tag.outputs.version }} --no-git-tag-version --allow-same-version

      - name: 运行测试
        run: npm test

      - name: 构建产物（portable + NSIS 安装包 + SHA256SUMS）
        run: npm run dist

      - name: 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dsh-desktop/dist/Deepseek-Harness-EAC-Setup-*.exe
            dsh-desktop/dist/Deepseek-Harness-EAC-Portable-*.exe
            dsh-desktop/dist/*.blockmap
            dsh-desktop/dist/SHA256SUMS.txt
