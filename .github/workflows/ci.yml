name: CI

on:
  push:
    branches:
      - main
      - refactor/vnext-ts-isolation
      - merge/vnext-tauri
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!research/**'
      - '**/SKILL.md'
      - '.agents/skills/deepseek-harness-eac-dev/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tauri ${{ matrix.os }} x64
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-shell -> target
            dsh-desktop/native/supervisor -> target
            dsh-desktop/native/snapshot -> target
          key: ${{ matrix.os }}-x64

      - name: 安装依赖
        run: npm ci

      - name: 获取内置运行时
        run: npm run fetch-runtime

      - name: 类型检查
        run: npm run typecheck

      - name: Rust clippy
        run: npm run clippy:native

      - name: Rust 原生模块测试
        run: npm run test:native

      - name: Tauri 壳测试
        run: cargo test --manifest-path ../tauri-shell/Cargo.toml

      - name: Node 测试
        run: npm test

      - name: 构建 Rust 原生模块
        run: npm run build:native

      - name: 构建 Tauri
        run: npm run tauri:build

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-windows-x64-ci
          path: |
            tauri-shell/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-linux-x64-ci
          path: |
            tauri-shell/target/release/bundle/deb/*.deb
            tauri-shell/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
