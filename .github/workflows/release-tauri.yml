name: Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 6.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tauri ${{ matrix.os }} x64
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dsh-desktop
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 从标签或输入提取版本号
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ github.event.inputs.version }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "::error::'$raw' 不是有效版本号"
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then tag="v${version}"; else tag="${GITHUB_REF_NAME}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 安装 Linux 系统依赖
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: dsh-desktop/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tauri-shell -> target
            dsh-desktop/native/supervisor -> target
            dsh-desktop/native/snapshot -> target
          key: release-${{ matrix.os }}-x64

      - name: 安装依赖
        run: npm ci

      - name: 注入 package 版本
        run: npm version ${{ steps.tag.outputs.version }} --no-git-tag-version --allow-same-version

      - name: 注入 Tauri 版本
        working-directory: tauri-shell
        shell: bash
        run: node -e "const fs=require('fs');const f='tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version='${{ steps.tag.outputs.version }}';fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"

      - name: 获取内置运行时
        run: npm run fetch-runtime

      - name: 类型检查
        run: npm run typecheck

      - name: Rust 原生模块测试
        run: npm run test:native

      - name: Tauri 壳测试
        run: cargo test --manifest-path ../tauri-shell/Cargo.toml

      - name: Node 测试
        run: npm test

      - name: 构建 Rust 原生模块
        run: npm run build:native

      - name: 构建 Tauri
        run: npm run tauri:build

      - name: 构建 Windows 便携包
        if: runner.os == 'Windows'
        working-directory: tauri-shell
        run: node make-portable.mjs --out target/release/portable

      - name: 上传 Windows 产物
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-Windows-x64-release
          path: |
            tauri-shell/target/release/bundle/nsis/*.exe
            tauri-shell/target/release/portable/Deepseek-Harness-EAC-*-portable.zip
            tauri-shell/target/release/portable/SHA256SUMS.txt
          if-no-files-found: error

      - name: 上传 Linux 产物
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-eac-Linux-x64-release
          path: |
            tauri-shell/target/release/bundle/deb/*.deb
            tauri-shell/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: 发布双平台资产
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag || github.ref_name }}
          name: ${{ needs.build.outputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/bundle/nsis/*.exe
            artifacts/bundle/deb/*.deb
            artifacts/bundle/appimage/*.AppImage
            artifacts/portable/Deepseek-Harness-EAC-*-portable.zip
            artifacts/portable/SHA256SUMS.txt
